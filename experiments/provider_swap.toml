name = "provider_swap"
config = "blind-anthropic"
time_limits_minutes = [10, 30, 120]
epochs = 2
min_runtime_fraction = 0.75
score_during_generation = false
max_samples = 1
max_sandboxes = 1
max_retries = 5
request_timeout_seconds = 900
attempt_timeout_seconds = 600
retry_on_error = 2
logs_dir = "logs/provider_swap"

# Round 4 re-run on data/verbatim_anthropic (scripts/swap_provider.py): same config
# apart from the data variant, same limits, same systems minus the two ReAct cells
