[project]
name = "report-eval-harness"
version = "0.1.0"
description = "Blind incident-investigation evals on urlquery.net records, built on Inspect"
readme = "README.md"
authors = [
    { name = "Hugo Elias Berg", email = "hugo@hugob.se" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "inspect-ai>=0.3.266",
    "inspect-swe>=0.2.71",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
report-eval-harness = "report_eval_harness:main"

[project.entry-points.inspect_ai]
report_eval_harness = "report_eval_harness._registry"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
# Avoid pyenv/rye shims (they hang uv's interpreter discovery on this machine).
python-preference = "only-managed"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["docker: needs a running Docker daemon"]
