<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Village findings review</title>
<style>
:root{color-scheme:light;--ink:#242a32;--muted:#68717d;--line:#dedfe3;--blue:#234f87;--paper:#fff;--wash:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}
button,select{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer}a{color:var(--blue)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #97bce5;outline-offset:3px}
header{padding:14px 24px 12px;background:var(--paper);border-bottom:1px solid var(--line)}header .top{display:flex;gap:16px;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header p{margin:4px 0 10px;color:var(--muted);font-size:13px}.links{display:flex;gap:14px;font-size:12px;flex-wrap:wrap}
nav{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;text-align:left;font-size:13px}.tab.active{background:#eaf0f8;border-color:#7999c0;color:#183e6a}.tab small{display:block;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,1fr);height:calc(100dvh - var(--header-height,154px));gap:1px;background:var(--line)}.pane{background:var(--paper);overflow-y:auto;position:relative;scroll-behavior:smooth;padding:0 26px 110px;scroll-padding-top:68px}.pane-heading{position:sticky;top:0;background:rgba(255,255,255,.97);z-index:2;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.pane-heading h2{font-size:14px;margin:0}.pane-heading span{font-size:12px;color:var(--muted)}
#article{max-width:760px;margin:0 auto;font:16px/1.75 Georgia,serif}#article h2,#article h3{line-height:1.35}#article .article-title{font:700 27px/1.3 system-ui,sans-serif}#article img{max-width:100%;height:auto;display:block;margin:12px auto;border:1px solid var(--line);cursor:zoom-in}#article figure{margin:20px 0}#article figcaption{font:13px/1.5 system-ui,sans-serif;color:var(--muted)}#article p{margin:18px 0}#article blockquote{border-left:3px solid #ccd7e5;margin:16px 0;padding:0 16px}#article table{display:block;overflow:auto}#article :is(h1,h2,h3,h4){font-family:system-ui,sans-serif}#article pre{white-space:pre-wrap}#article .source-target{outline:3px solid #edc95e;outline-offset:5px;background:#fff6d6}::highlight(source-evidence){background:#ffe397;color:#151515}
.finding{border:1px solid var(--line);border-radius:9px;padding:18px;margin:0 0 20px;background:#fff}.finding h3{font-size:18px;line-height:1.4;margin:0 0 8px}.finding p{margin:8px 0}.fid{color:var(--blue);font-size:12px;font-weight:700;margin-right:6px}.subfinding{margin-top:18px;border-top:1px solid var(--line);padding:15px 0 0 12px;border-left:3px solid #d8e2ef}.subfinding h4{font-size:14px;line-height:1.6;margin:0 0 9px;font-weight:600}.review-choice{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:10px}.review-choice button{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted)}.review-choice button.selected{background:#eaf0f8;border-color:#7797bf;color:var(--blue)}.review-choice .choice-status{font-size:11px;color:var(--muted)}
.evidence{background:#f6f7fa;border-radius:6px;padding:10px 12px;margin:8px 0;font-size:13px}.evidence blockquote{margin:0;border-left:2px solid #b6c5d9;padding-left:10px}.evidence button{background:none;border:0;padding:0;color:var(--blue);font-size:12px;text-decoration:underline;text-align:left;margin:6px 0 0}.location{font-size:11px;color:var(--muted);margin:5px 0}.evidence-links{font-size:11px;display:flex;gap:8px;flex-wrap:wrap}.note{font-size:12px;color:var(--muted)}.verification{font-size:11px;color:#7c5d24}.limits{background:#fff8e8;border:1px solid #ecdcb8;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:18px}.limits summary,.excluded summary{cursor:pointer;font-weight:600}.limits ul{padding-left:18px;margin:8px 0}.excluded{font-size:13px;border-top:1px solid var(--line);padding:15px 0}.excluded li{margin:10px 0}.toast{position:fixed;bottom:68px;left:24px;padding:9px 14px;background:#24354b;color:#fff;border-radius:6px;z-index:9990;font-size:13px}.toast[hidden]{display:none}
#error{color:#a3261b;padding:20px}.zoom{max-width:94vw;max-height:94vh;border:0;padding:8px;border-radius:8px;background:#fff}.zoom::backdrop{background:#000b}.zoom img{max-width:90vw;max-height:84vh;object-fit:contain}.zoom button{display:block;margin:0 0 8px auto;border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 12px}
@media(max-width:850px){header{padding:12px}main{display:flex;flex-direction:column;height:auto}.pane{overflow:visible;padding:0 16px 50px}.pane-heading{position:static}#source-pane{max-height:65dvh;overflow:auto}#article{font-size:15px}.finding{padding:14px}.tab{max-width:100%}}@media(prefers-reduced-motion:reduce){.pane{scroll-behavior:auto}}
</style>
</head>
<body>
<header id="header"><div class="top"><h1>AI Village findings review</h1><div class="links"><a id="prompt-link" target="_blank" rel="noopener">Extraction prompt</a><a href="extraction-prompt-v2.md" download>Prompt used</a></div></div><p>Three independent Sol extractions. Source candidates, not yet checked against logs. Select text or use 💬 to comment; optional Keep / Revise / Drop choices save automatically.</p><nav id="tabs" aria-label="Substack posts"></nav></header>
<main><section class="pane" id="source-pane" aria-label="Source article"><div class="pane-heading"><h2>Substack source</h2><a id="source-link" target="_blank" rel="noopener">Open original ↗</a></div><article id="article"></article></section><section class="pane" id="findings-pane" aria-label="Extracted findings"><div class="pane-heading"><h2>Findings and subfindings</h2><span id="count"></span></div><div id="findings"></div></section></main>
<div id="toast" class="toast" hidden role="status"></div>
<dialog class="zoom" id="zoom"><button id="close-zoom">Close image</button><img alt="Enlarged source screenshot" id="zoom-image"></dialog>
<script src="feedback-recovery.js"></script>
<script src="/_uikit/uikit.js"></script>
<script>
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
let data,kit,current,toastTimer;
function toast(message){const e=document.getElementById('toast');e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,5000);}
function normalize(s){return s.replace(/\s+/g,' ').trim();}
function showSourceImage(number){const article=document.getElementById('article');article.querySelectorAll('.source-target').forEach(e=>e.classList.remove('source-target'));if(window.CSS?.highlights)CSS.highlights.delete('source-evidence');const image=article.querySelector(`[data-source-image="${number}"]`);if(!image){toast('Screenshot not found here; open the original post.');return;}image.classList.add('source-target');image.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
function showEvidence(quote){
 const article=document.getElementById('article');article.querySelectorAll('.source-target').forEach(e=>e.classList.remove('source-target'));if(window.CSS?.highlights)CSS.highlights.delete('source-evidence');
 const walker=document.createTreeWalker(article,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];let text='',n;while(n=walker.nextNode()){nodes.push({node:n,start:text.length});text+=n.textContent;}
 let normalized='',offsets=[];for(let i=0;i<text.length;i++){if(/\s/.test(text[i])){if(normalized.endsWith(' '))continue;normalized+=' ';offsets.push(i);}else{normalized+=text[i];offsets.push(i);}}
 const target=normalize(quote),start=normalized.indexOf(target);if(start<0){toast('Quote not found in article text. It may come from a screenshot; see the evidence location.');return;}
 const first=offsets[start],last=offsets[start+target.length-1]+1;const a=nodes.find(x=>first>=x.start&&first<x.start+x.node.length),b=nodes.find(x=>last>x.start&&last<=x.start+x.node.length);if(!a||!b)return;
 const range=document.createRange();range.setStart(a.node,first-a.start);range.setEnd(b.node,last-b.start);if(window.CSS?.highlights&&window.Highlight)CSS.highlights.set('source-evidence',new Highlight(range));const container=a.node.parentElement.closest('p,blockquote,li,h2,h3,figcaption')||a.node.parentElement;container.classList.add('source-target');container.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function choice(key){const root=el('div','review-choice');for(const label of ['Keep','Revise','Drop']){const b=el('button',null,label);b.type='button';b.dataset.choice=label.toLowerCase();b.onclick=()=>kit.save(key,{...(kit.get(key)||{}),decision:b.dataset.choice});root.append(b);}const status=el('span','choice-status');root.append(status);root.dataset.reviewKey=key;refreshChoice(root);return root;}
function refreshChoice(root){const saved=kit.get(root.dataset.reviewKey)||{};root.querySelectorAll('[data-choice]').forEach(b=>{const on=saved.decision===b.dataset.choice;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on));});root.querySelector('.choice-status').textContent=saved.decision?'Your choice':'Unreviewed';}
function addSupport(parent,support){const box=el('div','evidence');box.append(el('blockquote',null,support.quote));if(support.location)box.append(el('div','location',support.location));const number=Number(support.image_number);const b=el('button',null,number?`Show screenshot ${number} in source`:'Show quote in source');b.onclick=()=>number?showSourceImage(number):showEvidence(support.quote);box.append(b);const links=el('div','evidence-links');for(const entry of support.record_links||[]){const url=typeof entry==='string'?entry:entry.url;if(!url||!/^https?:\/\//.test(url))continue;const a=el('a',null,typeof entry==='string'?'Village record ↗':entry.label||'Village record ↗');a.href=url;a.target='_blank';a.rel='noopener';links.append(a);}box.append(links);parent.append(box);}
function listNotes(root,notes,cls='note'){if(!notes)return;if(Array.isArray(notes)){for(const n of notes)root.append(el('p',cls,typeof n==='string'?n:JSON.stringify(n)));}else root.append(el('p',cls,notes));}
function draw(index){
 current=index;const post=data.articles[index];location.hash=post.key;document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',i===index);t.setAttribute('aria-current',i===index?'page':'false');});document.getElementById('source-link').href=post.url;
 const article=document.getElementById('article');article.innerHTML=post.html;article.prepend(el('h2','article-title',post.title));article.querySelectorAll('img').forEach(img=>{img.addEventListener('click',event=>{event.preventDefault();document.getElementById('zoom-image').src=img.src;document.getElementById('zoom').showModal();});img.addEventListener('error',()=>{img.alt='Image unavailable here; open the original post to inspect it.';});});
 const root=document.getElementById('findings');root.replaceChildren();const extraction=post.extraction,findings=extraction.findings;document.getElementById('count').textContent=`${findings.length} findings · ${findings.reduce((n,f)=>n+f.subfindings.length,0)} subfindings`;
 const limits=el('details','limits');limits.dataset.uikitSection=post.key+'-limits';limits.append(el('summary',null,'Source and evidence limits'));listNotes(limits,extraction.source_limits);root.append(limits);
 for(const f of findings){const key=post.key+'-'+f.id;const card=el('section','finding');card.dataset.uikitSection=key;const h=el('h3');h.append(el('span','fid',f.id),document.createTextNode(f.headline));card.append(h,el('p',null,f.finding),choice(key));listNotes(card,f.notes);
  for(const sf of f.subfindings){const sub=el('section','subfinding');const skey=post.key+'-'+sf.id;sub.dataset.uikitSection=skey;const sh=el('h4');sh.append(el('span','fid',sf.id),document.createTextNode(sf.claim));sub.append(sh);for(const support of sf.source_support||[])addSupport(sub,support);if(sf.evidence_note)sub.append(el('p','note',sf.evidence_note));sub.append(el('p','verification','Log evidence: '+(typeof sf.log_evidence==='string'?sf.log_evidence:'not yet verified')));listNotes(sub,sf.notes);sub.append(choice(skey));card.append(sub);}root.append(card);}
 const omitted=el('details','excluded');omitted.dataset.uikitSection=post.key+'-excluded';omitted.append(el('summary',null,'What Sol left out'));const ul=el('ul');for(const item of extraction.excluded_source_claims||[]){ul.append(el('li',null,typeof item==='string'?item:item.claim+' — '+item.reason));}omitted.append(ul);root.append(omitted);const download=el('a',null,'Download Sol’s Markdown output');download.href='trial-'+post.key+'.md';download.download='';root.append(download);document.getElementById('source-pane').scrollTop=0;document.getElementById('findings-pane').scrollTop=0;
}
(async()=>{
 await recoverAnonymousFeedback();data=await fetch('review.json').then(r=>{if(!r.ok)throw Error('Could not load extraction data');return r.json();});kit=await UIKit.init({comments:true});document.getElementById('prompt-link').href=data.prompt_url;if(data.articles.every(p=>p.extraction.image_review?.inspected===p.extraction.image_review?.total&&p.extraction.image_review?.total>0))document.querySelector('header p').textContent='Three Sol extractions revised after inspecting the source images. Log evidence is still unverified. Select text or use 💬 to comment; optional Keep / Revise / Drop choices save automatically.';
 data.articles.forEach((post,i)=>{const b=el('button','tab',post.title);b.type='button';b.append(el('small',null,`${post.extraction.findings.length} findings`));b.onclick=()=>draw(i);document.getElementById('tabs').append(b);});
 new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',document.getElementById('header').getBoundingClientRect().height+'px')).observe(document.getElementById('header'));
 kit.onChange(key=>{if(key)document.querySelectorAll('[data-review-key]').forEach(root=>{if(root.dataset.reviewKey===key)refreshChoice(root);});});const initial=data.articles.findIndex(p=>p.key===location.hash.slice(1));draw(initial<0?0:initial);
 document.getElementById('close-zoom').onclick=()=>document.getElementById('zoom').close();window.addEventListener('hashchange',()=>{const next=data.articles.findIndex(p=>p.key===location.hash.slice(1));if(next>=0&&next!==current)draw(next);});
})().catch(error=>{const box=el('p',null,error.message);box.id='error';document.body.prepend(box);});
</script>
</body></html>
