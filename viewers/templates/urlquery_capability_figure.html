<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>URLQuery · performance vs capability</title>
<style>
  :root{--bg:#f6f6f2;--ink:#17181a;--muted:#666a70;--line:#dcded9;--grid:#e9eae5}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
  main{max-width:1180px;margin:auto;padding:32px 24px 60px}h1{font:600 29px/1.2 Georgia,serif;margin:0 0 6px}
  h2{font:600 19px/1.25 Georgia,serif;margin:28px 0 10px}p{color:var(--muted);margin:0 0 16px;max-width:80ch}
  .panel{background:#fff;border:1px solid var(--line);border-radius:5px;padding:16px 12px 8px;overflow-x:auto}
  svg{display:block;min-width:720px;width:100%;height:auto}svg text{font:11px system-ui,sans-serif;fill:var(--muted)}
  .axis{stroke:var(--line)}.grid{stroke:var(--grid)}.link{fill:none;stroke-width:1.5;stroke-dasharray:4 3}
  .dot{stroke-width:1.8;cursor:default}.tick{font-variant-numeric:tabular-nums}
  .model-label{cursor:grab;user-select:none;touch-action:none}.model-label:active{cursor:grabbing}
  .key{display:flex;gap:15px;flex-wrap:wrap;margin:10px 3px 0;color:var(--muted);font-size:12px}
  .key span:before{content:"";display:inline-block;width:9px;height:9px;border:2px solid currentColor;border-radius:50%;margin-right:6px}
  button{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;background:white;padding:2px 8px;cursor:pointer}
  table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}
  .tablewrap{overflow-x:auto}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
  .pending{color:#8a8d91}.foot{font-size:12px;margin-top:12px}a{color:inherit}
</style></head><body><main>
<h1>URLQuery: performance against general capability</h1>
<p id="summary"></p>
<div class="panel"><svg id="chart" viewBox="0 0 990 590" role="img" aria-label="URLQuery performance against Epoch Capabilities Index"></svg>
<div class="key"><span>10 min: hollow</span><span>30 min: filled</span><span>Drag model names to arrange them</span><button id="reset-labels" type="button">Reset labels</button></div></div>
<h2>Model costs and scores</h2><div class="tablewrap"><table><thead><tr><th>Model</th><th>Epoch capability index</th><th>10 min score</th><th>30 min score</th><th>Valid reports</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="foot" id="costnote"></p>
<script type="application/json" id="data">__DATA__</script>
<script>window.onerror=(message)=>{document.getElementById('summary').textContent='Figure error: '+message}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent), svg=document.getElementById('chart');
const colors={openai:'#202126',anthropic:'#d97757',google:'#2e9e4f',meta:'#0668e1',moonshot:'#c2185b',zai:'#00897b',deepseek:'#7c55b6'};
const names=[...new Set(D.runs.map(r=>r.label))], N='http://www.w3.org/2000/svg';
const fmt=x=>x==null?'pending':'$'+x.toFixed(x<1?3:2), mean=xs=>xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
const groups=names.map(label=>({label, provider:D.runs.find(r=>r.label===label).provider, eci:D.capability[label]??null,
  budgets:[10,30].map(b=>{const runs=D.runs.filter(r=>r.label===label&&r.budget_min===b);
    return {b,runs,cost:runs.every(r=>r.cost_usd!=null)?mean(runs.map(r=>r.cost_usd)):null,score:runs.every(r=>r.performance!=null)?mean(runs.map(r=>r.performance)):null}})}));
const complete=D.runs.filter(r=>r.status==='complete').length, scored=D.runs.filter(r=>r.performance!=null).length;
document.getElementById('summary').textContent=`Final v6 run · ${complete} valid reports · ${D.excluded_runs.length} excluded · ${groups.filter(g=>g.eci).length}/12 models with an Epoch capability value. Hollow and filled marks distinguish the two time budgets. Judge: ${D.grade_source?.judge??'pending'}.`;
const missingCost=D.runs.filter(r=>r.status==='complete'&&r.cost_usd==null);
document.getElementById('costnote').textContent=D.capability_note;
const hasPending=groups.some(g=>g.budgets.some(q=>q.runs.length&&q.score==null));
if(!hasPending)svg.setAttribute('viewBox','0 0 990 490');
const el=(tag,attrs={},parent=svg)=>{let node=document.createElementNS(N,tag);for(let [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.appendChild(node);return node};
const label=(x,y,t,attrs={})=>{let a=el('text',{x,y,...attrs});a.textContent=t;return a};
const lo=153,hi=172,yLo=.15,yHi=.55;
const left=180,right=740,plotTop=35,bottom=400,strip1=445,strip2=470;
const X=x=>left+(x-lo)/(hi-lo)*(right-left),Y=y=>bottom-(y-yLo)/(yHi-yLo)*(bottom-plotTop);
for(const v of [155,160,165,170]){let x=X(v);el('line',{x1:x,x2:x,y1:plotTop,y2:bottom,class:'grid'});label(x,bottom+27,String(v),{'text-anchor':'middle',class:'tick'});}
for(let v=.2;v<=.5001;v+=.1){let y=Y(v);el('line',{x1:left,x2:right,y1:y,y2:y,class:'grid'});label(left-12,y+4,v.toFixed(2),{'text-anchor':'end',class:'tick'})}
el('line',{x1:left,x2:right,y1:bottom,y2:bottom,class:'axis'});label(18,plotTop+120,'Performance (0–1)',{transform:'rotate(-90 18 '+(plotTop+120)+')'});
label((left+right)/2,hasPending?strip2+53:bottom+53,'Epoch Capabilities Index (ECI)',{'text-anchor':'middle'});
if(hasPending){label(left,strip1-12,'Pending grades');label(left-12,strip1+4,'10 min',{'text-anchor':'end'});label(left-12,strip2+4,'30 min',{'text-anchor':'end'})}
for(const g of groups){const c=colors[g.provider], [a,b]=g.budgets;
  if(g.eci!=null&&a.score!=null&&b.score!=null)el('line',{x1:X(g.eci),y1:Y(a.score),x2:X(g.eci),y2:Y(b.score),stroke:c,class:'link'});
  for(const q of g.budgets){if(g.eci==null)continue;
    const y=q.score==null?(q.b===10?strip1:strip2):Y(q.score);
    let dot=el('circle',{cx:X(g.eci),cy:y,r:6,fill:q.b===10?'white':c,stroke:c,class:'dot'});
    el('title',{},dot).textContent=`${g.label} · ${q.b} min: ECI ${g.eci}, score ${q.score??'pending'}`;
  }
}
const labelled=groups.filter(g=>g.budgets[1].score!=null&&g.eci!=null).sort((a,b)=>b.budgets[1].score-a.budgets[1].score);
const leftNames=new Set(['DeepSeek V4 Flash','GPT-6 Luna','Muse Spark 1.3','Sonnet 5','Opus 4.6']);
const labelKey='urlquery-v6-capability-labels-v1';
let savedLabels={};try{savedLabels=JSON.parse(localStorage.getItem(labelKey)||'{}')}catch{}
const labelNodes=[];
for(const side of ['left','right']){
  let sideGroups=labelled.filter(g=>leftNames.has(g.label)===(side==='left')),prior=145;
  for(const g of sideGroups){const q=g.budgets[1],cy=Y(q.score),c=colors[g.provider];
    const defaultY=Math.max(cy+4,prior+18),stored=savedLabels[g.label];prior=defaultY;
    const pos={x:stored?.x??(side==='left'?135:760),y:stored?.y??defaultY};
    const path=el('path',{stroke:c,'stroke-width':.8,opacity:.7,fill:'none'});
    const name=label(pos.x,pos.y,g.label,{class:'model-label',style:`fill:${c};font-size:11px`});
    const update=()=>{const x=Number(name.getAttribute('x')),y=Number(name.getAttribute('y'));
      const anchor=x<X(g.eci)?'end':'start';name.setAttribute('text-anchor',anchor);
      path.setAttribute('d',`M${X(g.eci)+(anchor==='end'?-7:7)},${cy} L${x+(anchor==='end'?6:-6)},${y-4}`)};
    update();labelNodes.push({name,path,update,model:g.label});
    let drag=null;
    const point=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
    name.addEventListener('pointerdown',e=>{const p=point(e);drag={dx:Number(name.getAttribute('x'))-p.x,dy:Number(name.getAttribute('y'))-p.y};name.setPointerCapture(e.pointerId);e.preventDefault()});
    name.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e);
      name.setAttribute('x',Math.max(8,Math.min(982,p.x+drag.dx)));
      name.setAttribute('y',Math.max(18,Math.min(hasPending?565:475,p.y+drag.dy)));update()});
    const finish=()=>{if(!drag)return;drag=null;const positions={};
      for(const item of labelNodes)positions[item.model]={x:Number(item.name.getAttribute('x')),y:Number(item.name.getAttribute('y'))};
      try{localStorage.setItem(labelKey,JSON.stringify(positions))}catch{}};
    name.addEventListener('pointerup',finish);name.addEventListener('pointercancel',finish);
  }
}
document.getElementById('reset-labels').addEventListener('click',()=>{try{localStorage.removeItem(labelKey)}catch{}location.reload()});
const tbody=document.getElementById('rows');
for(const g of groups){let tr=document.createElement('tr'),[a,b]=g.budgets;
  let cells=[g.label,g.eci==null?'unavailable':g.eci.toFixed(2),a.runs.length?(a.score==null?'pending':a.score.toFixed(3)):'excluded',b.runs.length?(b.score==null?'pending':b.score.toFixed(3)):'excluded',
    `${a.runs.concat(b.runs).filter(r=>r.status==='complete').length}/4`];
  cells.forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i===0){let s=document.createElement('span');s.className='swatch';s.style.background=colors[g.provider];td.prepend(s)}if(v==='pending')td.className='pending';tr.append(td)});tbody.append(tr)
}
</script></main></body></html>
