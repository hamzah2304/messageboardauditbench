[project]
name = "messageboard-auditbench"
version = "0.1.0"
description = "Benchmark: can coding agents audit message-board logs of colluding AI agents?"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3",
    "anthropic",
    "openai",
    "pyyaml",
    "markdown-it-py>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["messageboard_audit"]
