[project]
name = "messageboard_audit_bench"
version = "0.1.0"
description = "Benchmark: can coding agents audit message-board logs of colluding AI agents?"
authors = [
    { name = "hamzah2304" },
    { name = "oscar-gilg" },
    { name = "hasanbaig8" },
]
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds are deliberate: this benchmark is meant to stay runnable and to
# reproduce committed grades over a long window. inspect_ai is pre-1.0 and its
# API moves within 0.3.x, and the provider SDKs make breaking major releases.
# Widen a bound only together with a lockfile refresh and a full test run.
dependencies = [
    "inspect_ai>=0.3.263,<0.4",
    "inspect-swe>=0.2.70,<0.3",
    "anthropic>=1.4,<2",
    "openai>=3.8,<4",
    "pyyaml>=6.0,<7",
    "markdown-it-py>=4.2.0,<5",
    "python-dotenv>=1.0,<2",
]

[project.urls]
"Source Code" = "https://github.com/hamzah2304/messageboardauditbench"
"Issue Tracker" = "https://github.com/hamzah2304/messageboardauditbench/issues"

# Register the package with Inspect so users can run
# `inspect eval messageboard_audit_bench/messageboard_audit_bench` after installation.
[project.entry-points.inspect_ai]
messageboard_audit_bench = "messageboard_audit_bench"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["messageboard_audit_bench"]

[tool.hatch.build.targets.sdist]
# Worktrees link generated data back to the primary checkout. Never ship those
# absolute symlinks (or local runs/credentials) in the source archive.
exclude = ["/data/**/*.jsonl", "/data/raw", "/data/augmented", "/runs", "/logs", "/.env", "/.worktrees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
include = [
    "messageboard_audit_bench/**/*.py",
    "benchmark/rubrics/build_rubrics_m5.py",
    "scripts/build_mythos5_data.py",
    "scripts/check_transcript_conversion.py",
    "scripts/run_round4.py",
    "scripts/score_reports.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
