<title>Answer Key Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a sticky toolbar and legend over one reading column of finding cards; a findings index sits to the left on wide screens.
   Every finding shows four layers in the same order, each with its own badge and border style:
   current rubric (plain outline, serif) / QA agent (violet tint, sans) / proposed wording (dashed teal, diff) / your decision (grey fill, ink top rule).
   QA has two steps, the per-finding data check and one overlap check of the whole key (key.overlap); each item shows one proposal combining both. */
:root {
  --bg: #f5f6f4; --surface: #ffffff; --ink: #1c2320; --muted: #5d6863; --line: #d9ddd9;
  --accent: #1f5a73; --accent-soft: #e2edf2;
  --ok: #2e6b3f; --ok-soft: #e3f0e6; --warn: #8a5a00; --warn-soft: #f6ecd6;
  --bad: #a3312b; --bad-soft: #f6e1df; --none: #59626c; --none-soft: #e8eaed;
  --qa: #5a3f8c; --qa-soft: #f2eef9; --qa-line: #cdbfe6;
  --prop: #1f5a73; --prop-line: #5f8ea3;
  --you: #1c2320; --you-soft: #eceeec;
  --del-bg: #fbe1de; --del-ink: #8f1f1a; --ins-bg: #d9f0df; --ins-ink: #175a2c;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131816; --surface: #1b211f; --ink: #e3e8e5; --muted: #9aa5a0; --line: #2f3834;
  --accent: #7fb6cf; --accent-soft: #1d3540;
  --ok: #8ccf9c; --ok-soft: #1c3324; --warn: #e2b862; --warn-soft: #3a2f17;
  --bad: #ee9a92; --bad-soft: #3d1f1d; --none: #aeb6bf; --none-soft: #272d33;
  --qa: #c7b5ef; --qa-soft: #241f33; --qa-line: #4b4068;
  --prop: #7fb6cf; --prop-line: #4f7f93;
  --you: #e3e8e5; --you-soft: #222926;
  --del-bg: #4b201d; --del-ink: #ffb8b0; --ins-bg: #173b25; --ins-ink: #a3e5b4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b211f; --ink: #e3e8e5; --muted: #9aa5a0; --line: #2f3834;
  --accent: #7fb6cf; --accent-soft: #1d3540;
  --ok: #8ccf9c; --ok-soft: #1c3324; --warn: #e2b862; --warn-soft: #3a2f17;
  --bad: #ee9a92; --bad-soft: #3d1f1d; --none: #aeb6bf; --none-soft: #272d33;
  --qa: #c7b5ef; --qa-soft: #241f33; --qa-line: #4b4068;
  --prop: #7fb6cf; --prop-line: #4f7f93;
  --you: #e3e8e5; --you-soft: #222926;
  --del-bg: #4b201d; --del-ink: #ffb8b0; --ins-bg: #173b25; --ins-ink: #a3e5b4; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; max-width: 1240px; margin: 0 auto; }
.card { overflow-wrap: anywhere; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
h1 { font: 600 18px/1.2 var(--sans); margin: 0; letter-spacing: .01em; }
.tabs, .filters, .seg { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
.tab, .filter, .segb { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.tab[aria-pressed="true"], .filter[aria-pressed="true"], .segb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.progress { font: 500 13px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 6px; font-size: 14px; }
.banner.err { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; margin-top: 16px; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } nav.index { display: none; } }
nav.index { position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-size: 13px; }
nav.index a { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px; border-radius: 4px; color: var(--ink); text-decoration: none; }
nav.index a:hover { background: var(--accent-soft); }
nav.index .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
nav.index .dot.done { background: var(--ok); } nav.index .dot.part { background: var(--warn); }
main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.intro { font-size: 14px; color: var(--muted); max-width: 70ch; margin: 0; }

/* legend: one line */
.legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend > span { display: inline-flex; gap: 5px; align-items: center; }
.legend .ex { font-family: var(--serif); font-size: 14px; color: var(--ink); }

/* layer badges: text label plus a distinct shape per layer */
.badge { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1.6 var(--sans); text-transform: uppercase; letter-spacing: .08em; padding: 0 7px; border-radius: 4px; white-space: nowrap; width: max-content; }
.b-rubric { border: 1px solid var(--muted); color: var(--muted); background: transparent; }
.b-qa { background: var(--qa); color: var(--surface); border: 1px solid var(--qa); }
.b-prop { background: transparent; color: var(--prop); border: 1px dashed var(--prop); }
.b-you { background: var(--you); color: var(--bg); border: 1px solid var(--you); }
.b-draft { border: 1px dotted var(--warn); color: var(--warn); background: transparent; }
.badge .glyph { font: 600 12px var(--mono); letter-spacing: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card:focus-within { border-color: var(--accent); }
.fhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fid { font: 600 15px var(--mono); color: var(--ink); }
.sub .fid { font-size: 13px; }
.fid:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { font: 500 12px var(--sans); padding: 1px 8px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.c-ok { background: var(--ok-soft); color: var(--ok); } .c-warn { background: var(--warn-soft); color: var(--warn); }
.c-bad { background: var(--bad-soft); color: var(--bad); } .c-none { background: var(--none-soft); color: var(--none); }
.c-accent { background: var(--accent-soft); color: var(--accent); }
.queue { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 10px; margin: 0; }

/* the four layers */
.layer { border-radius: 6px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.l-rubric { border: 1px solid var(--line); background: var(--surface); }
.l-qa { background: var(--qa-soft); border: 1px solid var(--qa-line); }
.pbox { border: 1.5px dashed var(--prop-line); border-radius: 6px; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pbox + .pbox, .note + .pbox { margin-top: 6px; }
.l-draft { border: 1px dotted var(--warn); background: var(--surface); }
.l-draft .decide { margin-top: 2px; }
.pts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font: 400 15px/1.45 var(--serif); }
.pid { font: 500 12px var(--mono); color: var(--muted); margin-right: 4px; }
.sep { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; width: 100%; }
.mini { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.crow { flex-wrap: nowrap; align-items: flex-start; }
.crow textarea { flex: 1; min-width: 0; }
.decide { background: var(--you-soft); border-top: 2px solid var(--you); border-radius: 6px; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }

.field { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 2px 10px; align-items: baseline; }
@media (max-width: 560px) { .field { grid-template-columns: minmax(0, 1fr); } }
.fname { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.claim { font: 400 19px/1.4 var(--serif); margin: 0; text-wrap: pretty; }
.sclaim { font: 400 16px/1.45 var(--serif); margin: 0; }
.detail { font: 400 15px/1.5 var(--serif); margin: 0; max-width: 75ch; }
.note { font-size: 13.5px; color: var(--muted); margin: 0; max-width: 80ch; }
.quote { font: italic 14px/1.45 var(--serif); color: var(--muted); margin: 0; }
.srcs { font-size: 13px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.srcs a { color: var(--accent); }
.tag { font: 500 11px var(--sans); color: var(--warn); border: 1px solid var(--warn); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }

.l-qa p { margin: 0; max-width: 80ch; font-size: 14px; }
.l-qa .verdictline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.ovnote { font-size: 13.5px; margin: 0; max-width: 80ch; border-top: 1px dashed var(--qa-line); padding-top: 6px; }
.ovnote .sent { font: italic 14px/1.45 var(--serif); color: var(--muted); }
.ovlist { margin: 0; padding-left: 18px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.subs { display: flex; flex-direction: column; gap: 14px; }
.subsh { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 0; border-top: 1px solid var(--line); padding-top: 12px; }
.sub { display: flex; flex-direction: column; gap: 8px; padding-left: 12px; border-left: 1px solid var(--line); }
.ev { font-size: 13.5px; margin: 4px 0; max-width: 85ch; overflow-wrap: anywhere; }
.cite { font: 12px var(--mono); background: var(--none-soft); border-radius: 3px; padding: 0 3px; }
.cite.fail { background: var(--bad-soft); color: var(--bad); }
.cite.okc { background: var(--ok-soft); }
details summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.l-qa details summary { color: var(--qa); }
details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* diffs */
.diff { font: 400 16px/1.55 var(--serif); margin: 0; overflow-wrap: anywhere; }
.diff.big { font-size: 18px; }
del.d, ins.i { text-decoration-thickness: 1.5px; border-radius: 2px; padding: 0 1px; }
del.d { background: var(--del-bg); color: var(--del-ink); text-decoration-line: line-through; }
ins.i { background: var(--ins-bg); color: var(--ins-ink); text-decoration-line: underline; text-underline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.split > div { min-width: 0; }
@media (max-width: 640px) { .split { grid-template-columns: minmax(0, 1fr); } }
.colh { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 2px; }
.wrap[data-diff="inline"] .v-split, .wrap[data-diff="split"] .v-inline { display: none; }
.dstat { font: 12px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
.empty-old { color: var(--muted); font: italic 13px var(--sans); }

/* decision controls */
.decide .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 5px; padding: 3px 10px; font-size: 13px; }
.dbtn[aria-pressed="true"][data-d="accept"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.dbtn[aria-pressed="true"][data-d="edit"] { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.dbtn[aria-pressed="true"][data-d="reject"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { width: 100%; font: 14px/1.45 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; resize: vertical; }
textarea.edit { font-family: var(--serif); font-size: 15px; }
.editdiff { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.status { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status.err { color: var(--bad); font-weight: 600; } .status.dirty { color: var(--warn); }
.status button { font-size: 12px; border: 1px solid var(--bad); color: var(--bad); background: transparent; border-radius: 4px; padding: 0 6px; margin-left: 4px; }
.stale { font-size: 12px; color: var(--warn); }
.save { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 5px; padding: 3px 12px; font-size: 13px; }
.save:disabled { opacity: .45; cursor: default; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 5px; padding: 4px 10px; font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }
.kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="wrap" id="wrap" data-diff="inline">
  <header class="bar">
    <h1>Answer Key Review</h1>
    <div class="tabs" role="group" aria-label="Eval" id="tabs"></div>
    <div class="filters" role="group" aria-label="Show" id="filters"></div>
    <div class="seg" role="group" aria-label="Show changes" id="diffmode">
      <button type="button" class="segb" data-mode="inline" aria-pressed="true">Inline changes</button>
      <button type="button" class="segb" data-mode="split" aria-pressed="false">Side by side</button>
    </div>
    <span class="progress" id="progress" aria-live="polite"></span>
  </header>
  <div id="banners"></div>
  <div class="layout">
    <nav class="index" id="index" aria-label="Findings"></nav>
    <main id="main">
      <p class="legend"><span><span class="badge b-rubric">Rubric</span> current key</span><span><span class="badge b-draft">Draft</span> model-drafted headline</span><span><span class="badge b-qa">QA</span> QA: data check and overlap check</span><span><span class="badge b-prop">Proposed</span> new wording</span><span><span class="badge b-you">You</span> your decision</span><span class="ex"><del class="d"><span class="sr">removed: </span>removed</del> <ins class="i"><span class="sr">added: </span>added</ins></span><span class="kh"><span class="kbd">j</span>/<span class="kbd">k</span> findings · <span class="kbd">Ctrl+Enter</span> save</span></p>
      <div id="content"><p class="empty">Loading the answer keys…</p></div>
    </main>
  </div>
</div>

<script>
"use strict";
const EVALS = [
  { id: "german-wiki", name: "German wiki", file: "keys/german-wiki.json", defaultFilter: "all" },
  { id: "aivillage", name: "AI Village", file: "keys/aivillage.json", defaultFilter: "queue" },
  { id: "transluce", name: "Transluce", file: "keys/transluce.json", defaultFilter: "all" },
];
const FILTERS = [["all", "All"], ["queue", "Review queue"], ["undecided", "Undecided"]];
const VERDICT_CLASS = { "supported": "c-ok", "partly": "c-warn", "contradicted": "c-bad", "not found": "c-none", "outside the data": "c-none" };
const OUTCOME_CLASS = { keep: "c-ok", narrow: "c-warn", drop: "c-bad" };
const state = { keys: {}, loadErrors: {}, evalId: "german-wiki", filter: null, decisions: {}, saving: {}, status: {},
                db: null, dbState: "connecting", userId: null, readOnly: false };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const docId = (ev, item) => `${ev}~${item}`;
const attrSafe = s => String(s).replace(/[^A-Za-z0-9_.~-]/g, "_");

/* ---------- word diff (plain LCS over word, space and punctuation tokens) ---------- */
function tokenize(s) { return String(s || "").match(/\s+|[\p{L}\p{N}]+(?:['’\-–][\p{L}\p{N}]+)*|[^\s\p{L}\p{N}]/gu) || []; }

function wordDiff(a, b, raw = false) {
  const A = tokenize(a), B = tokenize(b);
  let p = 0; while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let s = 0; while (s < A.length - p && s < B.length - p && A[A.length - 1 - s] === B[B.length - 1 - s]) s++;
  const a2 = A.slice(p, A.length - s), b2 = B.slice(p, B.length - s), n = a2.length, m = b2.length;
  const ops = A.slice(0, p).map(t => ["eq", t]);
  if (n * m > 400000) { for (const t of a2) ops.push(["del", t]); for (const t of b2) ops.push(["ins", t]); }
  else {
    const W = m + 1, L = new Uint32Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i * W + j] = a2[i] === b2[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a2[i] === b2[j]) { ops.push(["eq", a2[i]]); i++; j++; }
      else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) ops.push(["del", a2[i++]]);
      else ops.push(["ins", b2[j++]]);
    }
    while (i < n) ops.push(["del", a2[i++]]);
    while (j < m) ops.push(["ins", b2[j++]]);
  }
  for (const t of A.slice(A.length - s)) ops.push(["eq", t]);
  return raw ? ops.map(([t, x]) => ({ t, s: x })) : cleanup(ops);
}

/* Merge runs, fold tiny unchanged islands (spaces, "a", "of", any single word) inside a rewrite into the change, and put removals before additions. */
function cleanup(ops) {
  const segs = [];
  for (const [t, x] of ops) { const l = segs[segs.length - 1]; if (l && l.t === t) l.s += x; else segs.push({ t, s: x }); }
  const isChange = k => segs[k] && segs[k].t !== "eq";
  const out = []; let run = null;
  const flush = () => { if (run) { if (run.d) out.push({ t: "del", s: run.d }); if (run.i) out.push({ t: "ins", s: run.i }); run = null; } };
  for (let k = 0; k < segs.length; k++) {
    const g = segs[k];
    const tiny = g.t === "eq" && (g.s.replace(/\s+/g, "").length <= 3 || words(g.s) <= 1) && isChange(k - 1) && isChange(k + 1) && run;
    if (g.t === "eq" && !tiny) { flush(); out.push(g); continue; }
    run = run || { d: "", i: "" };
    if (g.t === "del") run.d += g.s; else if (g.t === "ins") run.i += g.s; else { run.d += g.s; run.i += g.s; }
  }
  flush();
  return out;
}

const words = s => (String(s).match(/[\p{L}\p{N}]+/gu) || []).length;
function diffStats(segs) {
  let d = 0, i = 0, e = 0;
  for (const g of segs) { if (g.t === "del") d += words(g.s); else if (g.t === "ins") i += words(g.s); else e += words(g.s); }
  return { d, i, e };
}
const D = s => `<del class="d"><span class="sr">removed: </span>${esc(s)}</del>`;
const I = s => `<ins class="i"><span class="sr">added: </span>${esc(s)}</ins>`;

/* old/new -> both views. old == null means there is no current text (all new); remove == true means the proposal deletes it. */
function diffHtml(oldText, newText, opts = {}) {
  const big = opts.big ? " big" : "";
  let segs;
  if (opts.remove) segs = [{ t: "del", s: oldText || "" }];
  else if (oldText == null || oldText === "") segs = [{ t: "ins", s: newText || "" }];
  else segs = wordDiff(oldText, newText);
  const st = diffStats(segs);
  const inline = segs.map(g => g.t === "eq" ? esc(g.s) : g.t === "del" ? D(g.s) : I(g.s)).join("");
  const oldSide = oldText == null || oldText === "" ? `<span class="empty-old">none</span>`
    : segs.filter(g => g.t !== "ins").map(g => g.t === "eq" ? esc(g.s) : D(g.s)).join("");
  const newSide = opts.remove ? `<span class="empty-old">removed</span>` : segs.filter(g => g.t !== "del").map(g => g.t === "eq" ? esc(g.s) : I(g.s)).join("");
  const stat = opts.remove ? `−${st.d}` : (oldText == null || oldText === "") ? `+${st.i}`
    : st.d === 0 && st.i === 0 ? "no change" : `−${st.d} +${st.i} words`;
  return `<p class="diff v-inline${big}">${inline}</p>
    <div class="split v-split"><div><div class="colh">${esc(opts.oldLabel || "Current")}</div><p class="diff${big}">${oldSide}</p></div>
      <div><div class="colh">${esc(opts.newLabel || "Proposed")}</div><p class="diff${big}">${newSide}</p></div></div>
    <span class="dstat">${stat}</span>`;
}

/* The text a finding-level QA proposal replaces: always the headline (proposed_claim in answer-key-qa-v1). */
function chosenBase(f) {
  const drafted = f.fields && f.fields.headline_status === "draft";
  return { key: "claim", short: drafted ? "Draft" : "Headline", text: f.claim };
}

/* ---------- overlap step: its edits per item, merged with the per-finding QA into one proposal ---------- */
const ovCache = new WeakMap();
function overlapOf(key) {
  if (!key) return new Map();
  if (ovCache.has(key)) return ovCache.get(key);
  const by = new Map();
  const get = id => { if (!by.has(id)) by.set(id, { edits: [], notes: [], incoming: [] }); return by.get(id); };
  const ov = key.overlap;
  if (ov && !ov.applied) for (const o of ov.overlaps || []) {
    for (const e of o.edits || []) { get(e.id).edits.push({ o, e }); if (e.to) get(e.to).incoming.push({ o, e }); }
    for (const id of [...(o.items || []), ...(o.edits || []).map(e => e.id)]) { const x = get(id); if (!x.notes.includes(o)) x.notes.push(o); }
  }
  ovCache.set(key, by);
  return by;
}
const ovFor = id => overlapOf(state.keys[state.evalId]).get(id) || null;
const ovEdit = (id, action, fieldName) => ((ovFor(id) || {}).edits || []).find(x => x.e.action === action && (!fieldName || x.e.field === fieldName));
const isRemove = pw => /^REMOVE\b/.test(pw || "");

/* The proposed headline or subfinding wording after both steps: {remove, why} or {text}, or null for no change. */
function proposal(x) {
  const rm = ovEdit(x.id, "remove"), rw = ovEdit(x.id, "rewrite", "claim"), pw = x.qa && x.qa.proposed_wording;
  if (rm) return { remove: true, why: `overlap ${rm.o.id}` };
  if (rw) return { text: rw.e.text };
  if (isRemove(pw)) return { remove: true, why: "QA" };
  return pw ? { text: pw } : null;
}

/* What the overlap check says about an item, for its QA layer. */
function overlapHtml(id) {
  const x = ovFor(id);
  if (!x) return "";
  const acts = x.edits.map(({ o, e }) => e.action === "move" ? `moves to ${e.to}` : e.action === "fold" ? `folds into ${e.to} as a subfinding`
    : e.action === "remove" ? "removed" : `${e.field === "claim" ? "reworded" : e.field.replace("_", " ") + " rewritten"}`);
  const inc = x.incoming.map(({ o, e }) => e.action === "fold" ? `gains ${e.id} as a subfinding: “${esc(e.claim)}” (${o.id})` : `gains ${esc(e.id)}, moved here (${o.id})`);
  return x.notes.map(o => {
    const others = (o.items || []).filter(i => i !== id);
    return `<div class="ovnote"><span class="chip c-warn">overlap ${esc(o.id)}</span>${others.length ? ` with ${esc(others.join(", "))}` : ""}${
      acts.length ? ` · this item: ${esc([...new Set(acts)].join(", "))}` : ""}. ${esc(o.reason || "")}
      ${o.sentence ? `<details><summary>A report sentence that would earn credit for each</summary><p class="sent">“${esc(o.sentence)}”</p></details>` : ""}</div>`;
  }).join("") + (inc.length ? `<div class="ovnote">This finding ${inc.join("; ")}.</div>` : "");
}

/* ---------- loading ---------- */
async function loadKeys() {
  await Promise.all(EVALS.map(async e => {
    try {
      const r = await fetch(e.file, { cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      state.keys[e.id] = await r.json();
    } catch (err) { state.loadErrors[e.id] = String(err.message || err); }
  }));
}

function queueIds(key) {
  const q = new Map();
  for (const x of key.review_queue || []) q.set(x.id, (q.get(x.id) ? q.get(x.id) + " | " : "") + x.why);
  return q;
}

/* Every reviewable item of a finding: its headline draft, the finding, each subfinding. (Ids are the stored doc ids; keep stable.) */
function itemsOf(ev, f) {
  const items = [];
  if (f.fields && f.fields.headline_status === "draft") items.push({ item: f.id + ".headline", kind: "headline", parent: f.id, text: f.claim });
  items.push({ item: f.id, kind: "finding", text: f.claim, qa: f.qa });
  for (const s of f.subfindings || []) items.push({ item: s.id, kind: "subfinding", parent: f.id, text: s.claim, qa: s.qa });
  return items.map(i => ({ ...i, doc: docId(ev, i.item) }));
}

function visibleFindings() {
  const key = state.keys[state.evalId];
  if (!key) return [];
  const q = queueIds(key);
  return key.findings.filter(f => {
    if (state.filter === "queue") return q.has(f.id);
    if (state.filter === "undecided") return itemsOf(state.evalId, f).some(i => !(state.decisions[i.doc] || {}).decision);
    return true;
  });
}

/* ---------- rendering ---------- */
function renderTabs() {
  $("#tabs").innerHTML = EVALS.map(e => `<button class="tab" type="button" data-ev="${e.id}" aria-pressed="${e.id === state.evalId}">${esc(e.name)}</button>`).join("");
  $("#filters").innerHTML = FILTERS.map(([id, label]) => `<button class="filter" type="button" data-f="${id}" aria-pressed="${id === state.filter}">${label}</button>`).join("");
}

function setDiffMode(mode) {
  $("#wrap").dataset.diff = mode;
  document.querySelectorAll(".segb").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  try { localStorage.setItem("review:diff", mode); } catch {}
}

function renderBanners() {
  const out = [];
  const err = state.loadErrors[state.evalId];
  if (err) out.push(`<div class="banner err" role="alert">The ${esc(state.evalId)} answer key did not load (${esc(err)}). Reload the page; if it persists, the key file was not published with the page.</div>`);
  if (state.dbState === "absent") out.push(`<div class="banner err" role="alert">Decisions cannot be saved in this view: the shared store is not available (open the page on claude.ai while signed in). Anything you type is kept only in this browser until saving works; use “Copy decisions” to hand them over another way.</div>`);
  else if (state.dbState === "connecting") out.push(`<div class="banner info">Connecting to the shared store…</div>`);
  else if (state.dbState === "error") out.push(`<div class="banner err" role="alert">Lost the live connection to the shared store (${esc(state.dbError)}). Saved decisions are safe; reload to reconnect. Unsaved text stays in this browser.</div>`);
  if (state.readOnly) out.push(`<div class="banner err" role="alert">Your access level cannot write decisions here, so they are not saved. Ask the owner for Contributor access.</div>`);
  $("#banners").innerHTML = out.join("");
}

function citeHtml(text, citations) {
  const byRef = new Map((citations || []).map(c => [c.ref, c]));
  return esc(text).replace(/\[([^\[\]]*)\]/g, (m, inner) => {
    const ref = (inner.match(/^([a-z_]+:[^\s;,&]+)/) || [])[1];
    const c = ref && byRef.get(ref.replace(/&quot;.*/, ""));
    const cls = !c ? "" : c.check === "ok" || c.check === "no_quote" ? " okc" : c.check === "unchecked" ? "" : " fail";
    const tip = c ? ` title="citation check: ${esc(c.check)}"` : "";
    return `<span class="cite${cls}"${tip}>[${inner}]</span>`;
  });
}

function evidenceHtml(ev) {
  if (!ev || !ev.length) return "";
  const fails = ev.flatMap(e => e.citations || []).filter(c => c.check === "id_missing" || c.check === "quote_missing").length;
  return `<details${fails ? " open" : ""}><summary>Evidence (${ev.length})${fails ? ` · ${fails} failed citation check` : ""}</summary>${
    ev.map(e => `<p class="ev">${citeHtml(e.text, e.citations)}</p>`).join("")}</details>`;
}

const field = (name, html) => `<div class="field"><span class="fname">${esc(name)}</span><div>${html}</div></div>`;
const sigChip = s => s ? `<span class="chip ${s === "minor" ? "c-none" : "c-accent"}">${esc(s)}</span>` : "";
const B = { rubric: `<span class="badge b-rubric">Rubric</span>`, qa: `<span class="badge b-qa">QA</span>`,
            prop: `<span class="badge b-prop">Proposed</span>`, you: `<span class="badge b-you">You</span>`, draft: `<span class="badge b-draft">Draft</span>` };

function decideHtml(it, labels, opts = {}) {
  const [a, e, r] = labels;
  return `<div class="decide" data-doc="${esc(it.doc)}" data-item="${esc(it.item)}" data-kind="${it.kind}">
    <div class="row" role="group" aria-label="Decision for ${esc(it.item)}">
      ${B.you}
      <button type="button" class="dbtn" data-d="accept" aria-pressed="false">${a}</button>
      <button type="button" class="dbtn" data-d="edit" aria-pressed="false">${e}</button>
      <button type="button" class="dbtn" data-d="reject" aria-pressed="false">${r}</button>
      <span class="status" aria-live="polite"></span>
    </div>
    <div class="stale" hidden></div>
    <textarea class="edit" rows="3" hidden aria-label="Your wording for ${esc(it.item)}"></textarea>
    <div class="editdiff" hidden></div>
    <div class="row crow"><textarea class="comment" rows="1" placeholder="${esc(opts.placeholder || "Comment")}" aria-label="Comment on ${esc(it.item)}"></textarea><button type="button" class="save" disabled title="Ctrl+Enter">Save</button></div>
  </div>`;
}

/* The current text an edit of this item is compared with. */
function editBase(itemId) {
  const key = state.keys[state.evalId];
  if (!key) return null;
  for (const f of key.findings) {
    if (itemId === f.id + ".headline") return { label: "Draft", text: f.claim };
    if (itemId === f.id) { const b = chosenBase(f); return { label: b.short, text: b.text }; }
    const s = (f.subfindings || []).find(x => x.id === itemId);
    if (s) return { label: "Current", text: s.claim };
  }
  return null;
}

/* A proposal shown in place of the text it changes: dashed box, "Proposed" badge, the old→new diff. */
function propBox(oldText, newText, opts = {}) {
  const badge = opts.what ? `<span class="badge b-prop">Proposed ${esc(opts.what)}</span>` : B.prop;
  return `<div class="pbox">${opts.head || `<div class="lhead">${badge}${opts.extra || ""}</div>`}${diffHtml(oldText, newText, opts)}</div>`;
}

/* Headline and detail of a finding. The one the QA proposal rewrites shows as the diff instead of plain text, so each text appears once. */
function findingText(f, which) {
  const text = which === "claim" ? f.claim : f.detail;
  const cls = which === "claim" ? "claim" : "detail";
  if (which === "detail") {
    const rw = ovEdit(f.id, "rewrite", "detail");
    return rw ? propBox(text, rw.e.text, { what: "detail", oldLabel: "Current", newLabel: "Proposed" }) : `<p class="${cls}">${esc(text)}</p>`;
  }
  const b = chosenBase(f), fold = ovEdit(f.id, "fold"), p = proposal(f);
  if (fold) return propBox(text, fold.e.claim, { big: true, what: `subfinding of ${fold.e.to}`, oldLabel: b.short, newLabel: "Proposed",
    extra: `<span class="chip c-warn">fold into ${esc(fold.e.to)}</span>` });
  if (!p) return `<p class="${cls}">${esc(text)}</p>`;
  if (p.remove) return propBox(text, "", { big: true, remove: true, extra: `<span class="chip c-bad">remove (${esc(p.why)})</span>` });
  return propBox(text, p.text, { big: true, what: "headline", oldLabel: b.short, newLabel: "Proposed" });
}

function rubricFinding(f) {
  const drafted = f.fields && f.fields.headline_status === "draft";
  const srcs = (f.fields && f.fields.sources) || [];
  const mh = f.qa && f.qa.make_harder, rwj = ovEdit(f.id, "rewrite", "judge_notes");
  const notes = rwj ? propBox(f.judge_notes, rwj.e.text, { what: "judge note", oldLabel: "Current", newLabel: "Proposed" })
    : (f.judge_notes ? `<p class="note">${esc(f.judge_notes)}</p>` : "")
    + (mh ? propBox(null, mh, { what: "judge note", oldLabel: "Current", newLabel: "Proposed" }) : "");
  return `<div class="layer l-rubric">
    <div class="lhead">${B.rubric}</div>
    ${drafted ? "" : field("Headline", findingText(f, "claim"))}
    ${f.detail ? field("Detail", findingText(f, "detail")) : ""}
    ${notes ? field("Judge notes", notes) : ""}
    ${srcs.length ? field("Sources", `<p class="srcs">${srcs.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.id)} ${esc(s.type || "")}${s.date ? ", " + esc(s.date) : ""}</a>`).join("")}</p>`) : ""}
  </div>`;
}

/* Queue reasons that only repeat the QA reason are dropped; the chip names the queue entry. */
function queueInfo(f, q) {
  if (!q.has(f.id)) return { chip: "", text: "" };
  const parts = q.get(f.id).split(" | ");
  const kinds = [...new Set(parts.map(p => p.split(":")[0]))];
  const reason = (f.qa && f.qa.reason) || "";
  const rest = parts.filter(p => { const body = p.slice(p.indexOf(":") + 1).trim(); return !(reason && body === reason.trim()); });
  return { chip: `<span class="chip c-bad">review queue: ${esc(kinds.join(", "))}</span>`, text: rest.length ? `<p class="queue">${esc(rest.join(" | "))}</p>` : "" };
}

function qaFinding(f) {
  const qa = f.qa;
  const ov = overlapHtml(f.id);
  if (!qa) return (f.evidence && f.evidence.length) || ov ? `<div class="layer l-qa"><div class="lhead">${B.qa}</div>${evidenceHtml(f.evidence)}${ov}</div>` : "";
  return `<div class="layer l-qa">
    <div class="lhead">${B.qa}<span class="verdictline"><span class="chip ${OUTCOME_CLASS[qa.outcome] || "c-none"}">${esc(qa.outcome)}</span>
      ${sigChip(f.significance)}${qa.duplicate_of ? `<span class="chip c-warn">duplicate of ${esc(qa.duplicate_of)}</span>` : ""}</span></div>
    ${qa.reason ? `<p>${esc(qa.reason)}</p>` : ""}
    ${evidenceHtml(f.evidence)}
    ${qa.how_to_find ? `<details><summary>How to find</summary><p>${esc(qa.how_to_find)}</p></details>` : ""}
    ${ov}
  </div>`;
}

function subHtml(s, it) {
  const qa = s.qa || null;
  const fl = s.fields || {};
  const quote = fl.report_quote || (Array.isArray(fl.quotes) && fl.quotes[0]) || "";
  const p = proposal(s), mv = ovEdit(s.id, "move"), rwj = ovEdit(s.id, "rewrite", "judge_notes");
  const claim = (!p ? `<p class="sclaim">${esc(s.claim)}</p>`
    : p.remove ? propBox(s.claim, "", { remove: true, extra: `<span class="chip c-bad">remove (${esc(p.why)})</span>` })
    : propBox(s.claim, p.text, { oldLabel: "Current", newLabel: "Proposed" }))
    + (mv ? `<p class="note"><span class="chip c-warn">moves to ${esc(mv.e.to)}</span></p>` : "");
  const jn = rwj ? propBox(s.judge_notes, rwj.e.text, { what: "judge note", oldLabel: "Current", newLabel: "Proposed" })
    : s.judge_notes ? `<p class="note"><b>Judge notes:</b> ${esc(s.judge_notes)}</p>` : "";
  const ov = overlapHtml(s.id);
  const rubric = `<div class="layer l-rubric">
    <div class="lhead">${B.rubric}</div>
    ${claim}
    ${quote ? `<p class="quote">“${esc(quote)}”</p>` : ""}
    ${jn}
  </div>`;
  const qaL = !qa ? ((s.evidence && s.evidence.length) || ov ? `<div class="layer l-qa"><div class="lhead">${B.qa}</div>${evidenceHtml(s.evidence)}${ov}</div>` : "")
    : `<div class="layer l-qa">
    <div class="lhead">${B.qa}<span class="verdictline">${qa.verdict ? `<span class="chip ${VERDICT_CLASS[qa.verdict] || "c-none"}">${esc(qa.verdict)}</span>` : ""}
      ${qa.overstated === "yes" ? `<span class="chip c-warn">overstated</span>` : ""}
      ${sigChip(s.significance)}${qa.duplicate_of ? `<span class="chip c-warn">duplicate of ${esc(qa.duplicate_of)}</span>` : ""}</span></div>
    ${qa.reason ? `<p>${esc(qa.reason)}</p>` : ""}
    ${evidenceHtml(s.evidence)}
    ${ov}
  </div>`;
  return `<section class="sub" aria-label="Subfinding ${esc(s.id)}">
    <div class="fhead"><span class="fid">${esc(s.id)}</span></div>
    ${rubric}${qaL}${decideHtml(it, ["Accept", "Edit", "Reject"])}
  </section>`;
}

function findingHtml(ev, f, q) {
  const items = itemsOf(ev, f);
  const head = items.find(i => i.kind === "headline");
  const section = f.fields && f.fields.section ? `<span class="chip c-none">${esc(f.fields.section)}</span>` : "";
  const dates = f.fields && f.fields.behavior_dates ? `<span class="status">${esc(f.fields.behavior_dates)}</span>` : "";
  const qi = queueInfo(f, q);
  return `<article class="card" id="f-${esc(f.id)}" data-fid="${esc(f.id)}">
    <div class="fhead"><span class="fid" tabindex="-1">${esc(f.id)}</span>${section}${qi.chip}${dates}</div>
    ${qi.text}
    ${head ? `<div class="layer l-draft" title="${esc((f.fields && f.fields.headline_source) || "")}"><div class="lhead">${B.draft}</div>${findingText(f, "claim")}
      ${decideHtml(head, ["Approve", "Edit", "Reject"])}</div>` : ""}
    ${rubricFinding(f)}
    ${qaFinding(f)}
    ${decideHtml(items.find(i => i.kind === "finding"), ["Accept", "Edit", "Reject"])}
    ${(f.subfindings || []).length ? `<div class="subsh">Subfindings</div>` : ""}
    <div class="subs">${(f.subfindings || []).map(s => subHtml(s, items.find(i => i.item === s.id))).join("")}</div>
  </article>`;
}

function renderMain() {
  const ev = state.evalId, key = state.keys[ev];
  const main = $("#content");
  if (!key) { main.innerHTML = `<p class="empty">${state.loadErrors[ev] ? "This answer key could not be loaded." : "Loading…"}</p>`; $("#index").innerHTML = ""; return; }
  const q = queueIds(key);
  const fs = visibleFindings();
  const intro = overlapSummary(key);
  main.innerHTML = `<div style="display:flex;flex-direction:column;gap:18px">` + intro + (fs.length ? fs.map(f => findingHtml(ev, f, q)).join("") : `<p class="empty">Nothing matches this filter.</p>`)
    + `<section class="card" aria-label="Whole-key comment">
        ${decideHtml({ doc: docId(ev, "_page"), item: "_page", kind: "page" }, ["", "", ""], { placeholder: "Comment on the whole " + EVALS.find(e => e.id === ev).name + " key" }).replace(/<button type="button" class="dbtn"[^>]*>[^<]*<\/button>/g, "")}</section>
      <div class="foot"><button type="button" class="ghost" id="copy">Copy decisions as JSON</button><span id="copy-status" class="status" aria-live="polite"></span>
</div>
      <textarea id="copy-fallback" rows="6" hidden aria-label="Decisions JSON"></textarea></div>`;
  $("#index").innerHTML = fs.map(f => `<a href="#f-${esc(f.id)}" data-fid="${esc(f.id)}"><span class="dot"></span><span>${esc(f.id)} ${esc((f.fields && f.fields.section) || "")}</span></a>`).join("");
  document.querySelectorAll(".decide").forEach(updateDecide);
  updateProgress();
}

/* One card for the overlap check: what it changed and the close pairs it kept apart. */
function overlapSummary(key) {
  const ov = key.overlap;
  if (!ov) return "";
  const os = ov.overlaps || [], ks = ov.kept_separate || [];
  const link = id => `<a href="#f-${esc(String(id).split(".")[0])}">${esc(id)}</a>`;
  return `<section class="card" aria-label="Overlap check">
    <div class="fhead"><span class="fid">Overlap check</span><span class="chip c-warn">${os.length} overlap${os.length === 1 ? "" : "s"}</span>
      <span class="chip c-none">${ks.length} kept separate</span>${ov.applied ? `<span class="chip c-ok">applied ${esc(ov.applied)}</span>` : ""}</div>
    <p class="note">The second QA step read the whole key and removed double credit. Each change is part of the proposal on the items it touches.</p>
    ${os.length ? `<ul class="ovlist">${os.map(o => `<li><b>${esc(o.id)}</b> ${(o.items || []).map(link).join(", ")}: ${esc(o.reason || "")}</li>`).join("")}</ul>` : ""}
    ${ks.length ? `<details><summary>Close pairs kept separate (${ks.length})</summary><ul class="ovlist">${ks.map(k => `<li>${(k.items || []).map(link).join(", ")}: ${esc(k.reason || "")}</li>`).join("")}</ul></details>` : ""}
  </section>`;
}

/* Show the reviewer's own wording as changes against the current rubric text. */
function updateEditDiff(box) {
  const edit = $("textarea.edit", box), out = $(".editdiff", box);
  const base = editBase(box.dataset.item);
  if (edit.hidden || !base) { out.hidden = true; return; }
  out.hidden = false;
  out.innerHTML = diffHtml(base.text, edit.value, { oldLabel: base.label, newLabel: "Yours" });
}

/* Sync one decision block with the stored decision, the local draft and the save status. */
function updateDecide(box) {
  const doc = box.dataset.doc, d = state.decisions[doc] || {}, draft = store.get("draft:" + doc), st = state.status[doc];
  box.querySelectorAll(".dbtn").forEach(b => b.setAttribute("aria-pressed", String(d.decision === b.dataset.d)));
  const edit = $("textarea.edit", box), comment = $("textarea.comment", box);
  const wantEdit = (draft && draft.decision === "edit") || d.decision === "edit";
  edit.hidden = !wantEdit;
  if (document.activeElement !== edit) edit.value = draft && draft.text != null ? draft.text : d.text || edit.value || "";
  if (document.activeElement !== comment) comment.value = draft && draft.comment != null ? draft.comment : d.comment || "";
  if (comment.value.includes("\n") || comment.value.length > 80) comment.rows = 3;
  updateEditDiff(box);
  const dirty = !!draft;
  $(".save", box).disabled = !dirty || state.readOnly;
  const status = $(".row .status", box);
  status.className = "status";
  if (st && st.kind === "saving") status.textContent = "Saving…";
  else if (st && st.kind === "error") { status.className = "status err"; status.innerHTML = `Not saved: ${esc(st.msg)} <button type="button" class="retry">Retry</button>`; }
  else if (dirty) { status.className = "status dirty"; status.textContent = "Unsaved text"; }
  else if (d.updated_at) status.textContent = `Saved ${new Date(d.updated_at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}`;
  else status.textContent = "";
  const stale = $(".stale", box), cur = currentText(box);
  if (d.decision && d.shown && cur != null && d.shown.text !== cur) { stale.hidden = false; stale.textContent = "The text under review changed after this decision was saved. Check it still applies."; }
  else stale.hidden = true;
}

/* Fingerprint of what the reviewer saw; stored as shown.text. Unchanged from the first version so saved decisions do not turn stale. */
function currentText(box) {
  const it = findItem(box.dataset.item);
  if (!it) return null;
  const ov = it.item === "_page" ? null : ovFor(it.item);
  return it.text + " ‖ " + JSON.stringify(it.qa || null) + (ov && ov.edits.length ? " ‖ " + JSON.stringify(ov.edits.map(x => x.e)) : "");
}
function findItem(item) {
  const key = state.keys[state.evalId];
  if (!key) return null;
  for (const f of key.findings) for (const it of itemsOf(state.evalId, f)) if (it.item === item) return it;
  return item === "_page" ? { item, text: "", qa: null } : null;
}

function updateProgress() {
  const key = state.keys[state.evalId];
  if (!key) { $("#progress").textContent = ""; return; }
  const all = visibleFindings().flatMap(f => itemsOf(state.evalId, f));
  const done = all.filter(i => (state.decisions[i.doc] || {}).decision).length;
  $("#progress").textContent = `${done} of ${all.length} items decided`;
  for (const a of document.querySelectorAll("nav.index a")) {
    const f = key.findings.find(x => x.id === a.dataset.fid), its = itemsOf(state.evalId, f);
    const n = its.filter(i => (state.decisions[i.doc] || {}).decision).length;
    a.querySelector(".dot").className = "dot" + (n === its.length ? " done" : n ? " part" : "");
  }
}

/* ---------- saving ---------- */
function setDraft(box, patch) {
  const doc = box.dataset.doc, d = state.decisions[doc] || {};
  const draft = store.get("draft:" + doc) || { decision: d.decision || "", text: d.text || "", comment: d.comment || "" };
  store.set("draft:" + doc, { ...draft, ...patch });
}

async function save(box, decisionClick) {
  const doc = box.dataset.doc;
  if (decisionClick !== undefined) setDraft(box, { decision: decisionClick });
  const draft = store.get("draft:" + doc);
  if (!draft) return;
  if (!state.db) { state.status[doc] = { kind: "error", msg: "no shared store in this view" }; updateDecide(box); return; }
  if (state.saving[doc]) { state.saving[doc].again = true; return; }
  state.saving[doc] = { again: false };
  state.status[doc] = { kind: "saving" }; updateDecide(box);
  const it = findItem(box.dataset.item);
  const body = { eval: state.evalId, item: box.dataset.item, kind: box.dataset.kind, decision: draft.decision || "",
                 text: draft.decision === "edit" ? draft.text || "" : "", comment: draft.comment || "",
                 shown: { text: currentText(box) || "" }, updated_at: new Date().toISOString(), by: state.userId || "" };
  if (it && it.parent) body.parent = it.parent;
  try {
    await withRetry(() => state.db.collection("decisions").doc(doc).set(body));
    const now = store.get("draft:" + doc);
    if (JSON.stringify(now) === JSON.stringify(draft)) store.del("draft:" + doc);
    state.decisions[doc] = body;
    delete state.status[doc];
  } catch (e) {
    if (e && e.code === "invalid_argument" && state.writeKnown === false) state.readOnly = true;
    state.status[doc] = { kind: "error", msg: e && e.code === "quota_exceeded" ? "the store is full" : (e && (e.message || e.code)) || "unknown error" };
    renderBanners();
  }
  const again = state.saving[doc].again;
  delete state.saving[doc];
  updateDecide(box); updateProgress();
  if (again && store.get("draft:" + doc)) save(box);
}

async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (!e || (e.code !== "unavailable" && e.code)) throw e;
    await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
    return fn();
  }
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button") || ev.target;
  if (t.matches(".tab")) { switchEval(t.dataset.ev); return; }
  if (t.matches(".filter")) { state.filter = t.dataset.f; renderTabs(); renderMain(); return; }
  if (t.matches(".segb")) { setDiffMode(t.dataset.mode); return; }
  const box = t.closest(".decide");
  if (t.matches(".dbtn") && box) {
    const d = t.dataset.d, cur = (state.decisions[box.dataset.doc] || {}).decision;
    const next = cur === d && d !== "edit" ? "" : d;
    if (next === "edit") {
      const edit = $("textarea.edit", box);
      const it = findItem(box.dataset.item);
      const p = it && it.kind !== "headline" && it.item !== "_page" ? proposal({ id: it.item, qa: it.qa }) : null;
      if (!edit.value) edit.value = p && !p.remove ? p.text : (it ? it.text : "");
      setDraft(box, { decision: "edit", text: edit.value });
      updateDecide(box); edit.hidden = false; updateEditDiff(box); edit.focus();
      return;
    }
    save(box, next);
    return;
  }
  if (t.matches(".save") && box) { save(box); return; }
  if (t.matches(".retry") && box) { save(box); return; }
  if (t.id === "copy") copyDecisions();
});
document.addEventListener("input", ev => {
  const box = ev.target.closest(".decide");
  if (!box) return;
  if (ev.target.matches("textarea.edit")) { setDraft(box, { text: ev.target.value }); updateEditDiff(box); }
  if (ev.target.matches("textarea.comment")) setDraft(box, { comment: ev.target.value });
  const b = $(".save", box); b.disabled = state.readOnly;
  const s = $(".row .status", box); s.className = "status dirty"; s.textContent = "Unsaved text";
});
document.addEventListener("keydown", ev => {
  const box = ev.target.closest && ev.target.closest(".decide");
  if (box && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(box); return; }
  if (ev.target.matches("textarea, input") || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "j" || ev.key === "k") {
    const cards = [...document.querySelectorAll("article.card")];
    if (!cards.length) return;
    const y = window.scrollY + 90;
    let i = cards.findIndex(c => c.offsetTop > y - 5);
    if (i < 0) i = cards.length;
    const target = ev.key === "j" ? cards[Math.min(i, cards.length - 1)] : cards[Math.max(i - 2, 0)];
    target.scrollIntoView({ block: "start" }); $(".fid", target).focus({ preventScroll: true });
  }
});
window.addEventListener("beforeunload", ev => {
  if (Object.keys(state.saving).length) { ev.preventDefault(); ev.returnValue = ""; }
});

async function copyDecisions() {
  const out = Object.values(state.decisions).filter(d => d.eval === state.evalId);
  const drafts = {};
  for (const f of state.keys[state.evalId]?.findings || []) for (const i of itemsOf(state.evalId, f)) { const d = store.get("draft:" + i.doc); if (d) drafts[i.item] = d; }
  const text = JSON.stringify({ eval: state.evalId, decisions: out, unsaved_drafts: drafts }, null, 1);
  try { await navigator.clipboard.writeText(text); $("#copy-status").textContent = `Copied ${out.length} decisions.`; }
  catch { const ta = $("#copy-fallback"); ta.hidden = false; ta.value = text; ta.select(); $("#copy-status").textContent = "Copy was blocked; the JSON is selected below."; }
}

function switchEval(ev) {
  state.evalId = ev;
  state.filter = EVALS.find(e => e.id === ev).defaultFilter;
  try { localStorage.setItem("review:eval", ev); } catch {}
  renderTabs(); renderBanners(); renderMain();
}

/* ---------- store ---------- */
async function connect() {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { state.dbState = "absent"; renderBanners(); return; }
  state.db = db;
  const user = await window.claude.use("user");
  if (user) {
    try { state.userId = await user.id(); } catch {}
    try { const w = await user.can("data.write"); if (w === false) state.readOnly = true; state.writeKnown = w; } catch {}
  }
  db.collection("decisions").onSnapshot(snap => {
    state.dbState = "live";
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    state.decisions = next;
    renderBanners();
    document.querySelectorAll(".decide").forEach(updateDecide);
    updateProgress();
  }, err => { state.dbState = "error"; state.dbError = err && (err.message || err.code); renderBanners(); });
}

(async function start() {
  let ev = null; try { ev = localStorage.getItem("review:eval"); } catch {}
  let mode = null; try { mode = localStorage.getItem("review:diff"); } catch {}
  setDiffMode(mode === "split" ? "split" : "inline");
  state.evalId = EVALS.some(e => e.id === ev) ? ev : "german-wiki";
  state.filter = EVALS.find(e => e.id === state.evalId).defaultFilter;
  renderTabs(); renderBanners();
  connect().catch(e => { state.dbState = "error"; state.dbError = String(e && (e.message || e.code) || e); renderBanners(); });
  await loadKeys();
  renderBanners(); renderMain();
})();
</script>
