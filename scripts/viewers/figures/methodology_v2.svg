<line class="tl" x1="1552" y1="431" x2="1648" y2="431"/>
<line class="tl" x1="1552" y1="449" x2="1618" y2="449"/>
<line class="tl" x1="1552" y1="467" x2="1648" y2="467"/>
<rect x="1546" y="476" width="108" height="16" rx="3" fill="#dfe4f3"/>
<line class="tl" x1="1552" y1="485" x2="1648" y2="485"/>
<line class="tl" x1="1552" y1="503" x2="1618" y2="503"/>
<line class="tl" x1="1552" y1="521" x2="1648" y2="521"/>
<text class="lab" x="1600" y="630" text-anchor="middle">AGENT REPORT</text>
<path class="dash" d="M1470,400 C1500,400 1500,395 1530,395"/>
<circle cx="1500" cy="397.5" r="10" fill="#f7f6f2" stroke="#1a1a1a" stroke-width="1.4"/><path class="ln" d="M1496,397.5 l3,3 l6,-6"/>
<path class="dash" d="M1470,480 C1500,480 1500,431 1530,431"/>
<circle cx="1500" cy="455.5" r="10" fill="#f7f6f2" stroke="#1a1a1a" stroke-width="1.4"/><path class="ln" d="M1496,455.5 l3,3 l6,-6"/>
<circle cx="1495" cy="560" r="10" fill="#f7f6f2" stroke="#1a1a1a" stroke-width="1.4"/><path class="ln" d="M1491,556 l8,8 M1499,556 l-8,8"/>
<text class="sub" x="1420" y="700" font-size="12" text-anchor="middle">claims found → <tspan fill="#1a1a1a" font-weight="600">recall</tspan></text>
<circle cx="1700" cy="485" r="10" fill="#f7f6f2" stroke="#1a1a1a" stroke-width="1.4"/><path class="ln" d="M1696,481 l8,8 M1694,481 l-8,8"/>
<text class="sub" x="1620" y="700" font-size="12" text-anchor="middle">passages vs. data → <tspan fill="#1a1a1a" font-weight="600">precision</tspan></text>
</svg>