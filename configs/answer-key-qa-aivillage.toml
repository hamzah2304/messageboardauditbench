# Answer-key QA for AI Village: as configs/answer-key-qa-german-wiki.toml, on the Village records.
# Launched by scripts/run_answer_key_qa.py with the AI Village modules.
name = "answer-key-qa-aivillage"
prompt = "answer-key-qa-v1"
budget_min = 30
timeout_min = 35
data_variant = "aivillage/full-v2-reasoning"
effort = "high"
claude_cli_version = "2.1.283"
codex_cli_version = "0.160.0"
min_runtime_fraction = 0
bash_max_output_length = 50000
subagents = false
claude_disallowed_tools = ["WebFetch", "WebSearch", "Skill", "ToolSearch", "RemoteTrigger", "SendMessage", "ListAgents", "Workflow", "CronCreate", "CronDelete", "CronList", "ScheduleWakeup", "EnterWorktree"]
memory_limit = "3g"
