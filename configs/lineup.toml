# The model lineup for the standard rerun: one row per model, used by the batch launcher
# (scripts/run_matrix.py), the cost estimates and the figures. `id` is what the runner is given
# (sandbox/docker/run_trial.sh <harness> <id> <replicate>); prices are list USD per million
# tokens, input then output, as of `checked`. Lab colours are shared with every figure.
#
# Left out on purpose: Opus 5.5 and Fable 5.1 (switch to Opus 4.8 on safety refusals), older
# generations (GPT-5.6, Opus 4.8, Sonnet 5, Haiku 4.5).

checked = "2026-10-21"

[labs]
anthropic = { name = "Anthropic", colour = "#d97757" }
openai = { name = "OpenAI", colour = "#202126" }
google = { name = "Google", colour = "#2e9e4f" }
meta = { name = "Meta", colour = "#0668e1" }
moonshot = { name = "Moonshot", colour = "#c2185b" }
zai = { name = "Z.ai", colour = "#00897b" }
deepseek = { name = "DeepSeek", colour = "#7c55b6" }
xai = { name = "xAI", colour = "#5f6368" }
alibaba = { name = "Alibaba", colour = "#ff6a00" }

[[models]]
id = "claude-opus-5"
label = "Opus 5"
lab = "anthropic"
harness = "claude"
price = [5.0, 25.0]

