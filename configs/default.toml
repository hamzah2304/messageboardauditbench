# Benchmark conditions for one trial. Systems (agent, model, seed) are chosen at launch.
name = "default"
prompt = "blind-v2"                 # sandbox/prompts/<prompt>.txt; {{BUDGET_MIN}} is filled in
budget_min = 20                # what the prompt tells the agent
timeout_min = 25             # hard kill of the container
data_variant = "raw_stripped" # data/<variant>; "verbatim" is the other built variant
effort = "high"               # reasoning effort passed to every scaffold
# Claude Code tools withheld from the agent (web access, subagents, skills, scheduling).
claude_disallowed_tools = ["WebFetch", "WebSearch", "Task", "Skill", "ToolSearch", "RemoteTrigger", "SendMessage", "ListAgents", "Workflow", "CronCreate", "CronDelete", "CronList", "ScheduleWakeup", "EnterWorktree"]

# Prompt target and strict upper limit (raw Markdown words).
# Acceptance allows short reports and 100 words above the prompted maximum.
report_min_words = 2500
report_max_words = 3000
report_accept_min_words = 0
report_accept_max_words = 3100
