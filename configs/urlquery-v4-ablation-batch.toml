# Swarm-v4 prompt with and without the Synthesis "Do not get lost in the
# details" sentence (urlquery-10 vs urlquery-10-swarm-v4-nodetails), plus one
# 30-minute sample per model for three models on the full prompt.
# Run: python -m messageboard_audit_bench.urlquery_pilot --dataset <data> --batch <this> --launch
max_parallel = 6

[[arms]]
config = "configs/urlquery-30.toml"
replicates = 1
models = ["codex:gpt-6-astra", "claude:claude-opus-4-8", "codex:gpt-6-sol"]

[[arms]]
config = "configs/urlquery-10.toml"
replicates = 2
models = ["codex:gpt-6-astra", "claude:claude-opus-5", "codex:gpt-6-sol", "claude:claude-opus-4-8",
          "codex:gpt-5.6-terra", "claude:claude-opus-4-6", "codex:gpt-6-luna", "claude:claude-sonnet-5"]

[[arms]]
config = "configs/urlquery-10-swarm-v4-nodetails.toml"
replicates = 2
models = ["codex:gpt-6-astra", "claude:claude-opus-5", "codex:gpt-6-sol", "claude:claude-opus-4-8",
          "codex:gpt-5.6-terra", "claude:claude-opus-4-6", "codex:gpt-6-luna", "claude:claude-sonnet-5"]

[[arms]]
config = "configs/urlquery-10.toml"
replicates = 1
models = ["react:google/gemini-3.8-flash"]

[[arms]]
config = "configs/urlquery-10-swarm-v4-nodetails.toml"
replicates = 1
models = ["react:google/gemini-3.8-flash"]
