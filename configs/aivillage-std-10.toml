# Generated by scripts/standard_configs.py from configs/standard.toml; edit that file, not this one.
# The standard condition for aivillage, 10 minutes.
name = "aivillage-std-10"
benchmark_id = "aivillage"
prompt = "aivillage-v12"
budget_min = 10
timeout_min = 15
data_variant = "aivillage/full-v2-reasoning"
effort = "medium"
min_runtime_fraction = 0.9
memory_limit = "3g"
subagents = false
claude_cli_version = "2.1.283"
