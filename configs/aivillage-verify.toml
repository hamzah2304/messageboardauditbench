# Step 3 of the AI Village answer key: check a group of merged findings against the Village records.
# Launched once per group by scripts/run_aivillage_verify.py, which fills the findings into the prompt and sets
# BUDGET_MIN to about five minutes per finding; budget_min here is only the default.
name = "aivillage-verify"
prompt = "aivillage-verify-v3"
budget_min = 20
timeout_min = 25
data_variant = "aivillage/full-v2-reasoning"
effort = "medium"
claude_cli_version = "2.1.283"
codex_cli_version = "0.160.0"
min_runtime_fraction = 0
bash_max_output_length = 50000
subagents = false
claude_disallowed_tools = ["WebFetch", "WebSearch", "Skill", "ToolSearch", "RemoteTrigger", "SendMessage", "ListAgents", "Workflow", "CronCreate", "CronDelete", "CronList", "ScheduleWakeup", "EnterWorktree"]
memory_limit = "3g"
