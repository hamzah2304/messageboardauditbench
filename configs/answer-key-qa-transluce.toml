# Answer-key QA for the Transluce report: as configs/answer-key-qa-german-wiki.toml, on the frozen
# urlquery.net scans. Launched by scripts/run_answer_key_qa.py with the Transluce modules.
name = "answer-key-qa-transluce"
benchmark_id = "urlquery"
prompt = "answer-key-qa-v1"
budget_min = 30
timeout_min = 35
data_variant = "urlquery/2026-09-26-v1"
dataset_sha256 = "973d7b7a1e14df236fbf5d99d9795ab3fdc0f40720c67376771fa19f0e299d1f"
effort = "high"
claude_cli_version = "2.1.283"
codex_cli_version = "0.160.0"
min_runtime_fraction = 0
bash_max_output_length = 50000
subagents = false
claude_disallowed_tools = ["WebFetch", "WebSearch", "Skill", "ToolSearch", "RemoteTrigger", "SendMessage", "ListAgents", "Workflow", "CronCreate", "CronDelete", "CronList", "ScheduleWakeup", "EnterWorktree"]
memory_limit = "3g"
