# Pilot: AI Village "what went wrong" report over the full export; variant: reasoning (reasoning traces kept or removed).
# Settings follow urlquery-agents-v6-10 except the data and the report length (2,500-3,000 words).
name = "aivillage-wrong-10-reasoning"
prompt = "aivillage-wrong-v1"
budget_min = 10
timeout_min = 15
data_variant = "aivillage/full-v1-reasoning"
effort = "medium"
claude_cli_version = "2.1.283"
codex_cli_version = "0.156.1"
min_runtime_fraction = 0.75
claude_disallowed_tools = ["WebFetch", "WebSearch", "Task", "Agent", "Skill", "ToolSearch", "RemoteTrigger", "SendMessage", "ListAgents", "Workflow", "CronCreate", "CronDelete", "CronList", "ScheduleWakeup", "EnterWorktree"]
report_min_words = 2500
report_max_words = 3000
report_accept_min_words = 0
report_accept_max_words = 3200
