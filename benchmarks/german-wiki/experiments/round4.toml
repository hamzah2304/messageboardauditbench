name = "round4"
config = "blind"
time_limits_minutes = [10, 30, 120]
epochs = 3
min_runtime_fraction = 0.75
score_during_generation = false
max_samples = 1
max_sandboxes = 1
max_retries = 5
request_timeout_seconds = 900
attempt_timeout_seconds = 600
retry_on_error = 2
logs_dir = "logs/round4"

# Claude Code and Codex use their existing subscription credentials. ReAct is
# first-class Inspect execution through OpenRouter; subscription ReAct is not
# part of round 4.

[[systems]]
id = "claude-opus-5"
agent = "claude"
backend = "subscription"
model = "claude-opus-5"
max_connections = 4

